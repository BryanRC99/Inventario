<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: 50mm 25mm;
      margin: 2mm;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 46mm;
      height: 21mm;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
    }

    .etiqueta {
      display: flex;
      align-items: stretch;
      gap: 1.5mm;
      width: 100%;
      height: 100%;
    }

    /* Logo a la izquierda, ocupando todo el espacio disponible */
    .logo-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1mm;
    }

    .logo {
      max-width: 90%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* Columna derecha: QR arriba, código y nombre abajo */
    .right {
      flex-shrink: 0;
      width: 13mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.5mm;
      overflow: hidden;
    }

    .qr {
      width: 13mm;
      height: 13mm;
      flex-shrink: 0;
    }

    .info {
      width: 13mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      line-height: 1;
    }

    .codigo {
      font-size: 6.5pt;
      font-weight: 700;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .nombre {
      font-size: 5pt;
      color: #444;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      max-width: 100%;
      margin-top: 0.3mm;
    }
  </style>
</head>

<body>
  <div class="etiqueta">
    {% if logo_uri %}
    <div class="logo-wrap">
      <img class="logo" src="{{ logo_uri }}" alt="Logo">
    </div>
    {% endif %}

    <div class="right">
      <img class="qr" src="data:image/png;base64,{{ qr_base64 }}" alt="QR">
      <div class="info">
        <div class="codigo">{{ activo.codigo_interno }}</div>
        <div class="nombre">{{ activo.nombre }}</div>
      </div>
    </div>
  </div>
</body>

</html>
