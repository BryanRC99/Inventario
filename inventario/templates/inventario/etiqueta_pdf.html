<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <style>
    @page {
      size: 50mm 25mm;
      margin: 2mm;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 46mm;
      height: 21mm;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
      color: #111827;
    }


    /* =========================================================
       ETIQUETA
       ========================================================= */

    .etiqueta {
      width: 46mm;
      height: 21mm;

      display: flex;
      align-items: stretch;

      overflow: hidden;

      border: 0.3mm solid #111827;
      border-radius: 1mm;

      background: #ffffff;
    }


    /* =========================================================
       COLUMNA IZQUIERDA (QR + TEXTO) - Ajustada al 44%
       ========================================================= */

    .izquierda {
      width: 44%;
      min-width: 44%;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 1.2mm 1.2mm 1.2mm 1.5mm;

      border-right: 0.25mm solid #d1d5db;
      overflow: hidden;
    }

    .qr-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .qr {
      width: 12.0mm;
      height: 12.0mm;
      display: block;
    }

    .informacion {
      width: 100%;
      overflow: hidden;
    }

    .codigo {
      width: 100%;

      font-size: 8.5pt;
      line-height: 1;

      font-weight: 700;
      letter-spacing: 0.15px;

      color: #111827;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nombre {
      width: 100%;

      margin-top: 0.5mm;

      font-size: 4.8pt;
      line-height: 1.05;

      color: #4b5563;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================================================
       COLUMNA DERECHA (LOGO) - Ajustada al 56%
       ========================================================= */

    .derecha {
      flex: 1;
      width: 56%;

      display: flex;
      align-items: center;
      justify-content: center;

      /* Se aumentó el padding arriba/abajo a 1.5mm para alejar el logo del borde */
      padding: 1.5mm 1.2mm;

      overflow: hidden;
    }

    .logo {
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;
      object-position: center;
    }

  </style>
</head>

<body>

  <div class="etiqueta">

    <!-- =====================================================
         IZQUIERDA: QR + INFORMACIÓN
         ===================================================== -->
    <div class="izquierda">

      <div class="qr-wrap">
        <img
          class="qr"
          src="data:image/png;base64,{{ qr_base64 }}"
          alt="Código QR">
      </div>

      <div class="informacion">
        <div class="codigo">
          {{ activo.codigo_interno }}
        </div>
        <div class="nombre">
          {{ activo.nombre }}
        </div>
      </div>

    </div>


    <!-- =====================================================
         DERECHA: LOGO PREDOMINANTE
         ===================================================== -->
    <div class="derecha">

      {% if logo_uri %}
      <img
        class="logo"
        src="{{ logo_uri }}"
        alt="Logo">
      {% endif %}

    </div>

  </div>

</body>
</html>
