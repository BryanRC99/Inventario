services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inventario_db}
      POSTGRES_USER: ${DB_USER:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventario} -d ${DB_NAME:-inventario_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PRIVATE_MEDIA_ROOT: /app/private_media
      RESPALDOS_ROOT: /app/respaldos
    volumes:
      - media_data:/app/media
      - private_media_data:/app/private_media
      - backups_data:/app/respaldos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  private_media_data:
  backups_data:
